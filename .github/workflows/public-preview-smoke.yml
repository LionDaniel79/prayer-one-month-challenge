name: Public App Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/prayer-one-month-challenge

permissions:
  contents: read

concurrency:
  group: public-app-smoke
  cancel-in-progress: true

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      EXPECTED_APP_NAME: ${{ vars.PUBLIC_APP_NAME || '56사랑' }}
      EXPECTED_APP_HEADING: ${{ vars.PUBLIC_APP_HEADING || '56공동체' }}
      EXPECTED_RELEASE: ${{ vars.PUBLIC_RELEASE_MARKER || 'community-refinement-20260929-v1' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Explain how to enable the public smoke test
        if: ${{ env.PUBLIC_APP_URL == '' }}
        run: |
          echo "PUBLIC_APP_URL is not configured."
          echo "Set Settings > Secrets and variables > Actions > Variables > PUBLIC_APP_URL to this repository's own deployment URL."
          echo "The workflow will not fall back to another installation."

      - name: Check released app and private boundaries anonymously
        if: ${{ env.PUBLIC_APP_URL != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const base=process.env.PUBLIC_APP_URL.replace(/\/$/u,'');
          const expectedRelease=process.env.EXPECTED_RELEASE;
          const expectedAppName=process.env.EXPECTED_APP_NAME;
          const expectedHeading=process.env.EXPECTED_APP_HEADING;
          const checks=[
            {path:'/community-release.json',status:200,kind:'release'},
            {path:'/login',status:200,kind:'login'},
            {path:'/api/health',status:200,kind:'health'},
            {path:'/manifest.webmanifest',status:200,kind:'manifest'},
            {path:'/community',status:307,kind:'redirect'},
            {path:'/admin/community',status:307,kind:'redirect'},
            {path:'/api/community/folders',status:401,kind:'private'},
            {path:'/api/community/posts/00000000-0000-4000-8000-000000000001/files/0/image',status:401,kind:'private'},
          ];
          const result={workflowCommit:process.env.GITHUB_SHA,base,expectedRelease,checkedAt:new Date().toISOString(),authenticated:false,checks:[]};
          let failed=false;
          for(const check of checks){
            let row;
            for(let attempt=1;attempt<=8;attempt++){
              try{
                const response=await fetch(base+check.path,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(10000)});
                const body=await response.text();let ok=response.status===check.status;const location=response.headers.get('location');
                if(ok&&check.kind==='redirect'){const target=new URL(location??'',base);ok=target.origin===new URL(base).origin&&target.pathname==='/login';}
                if(ok&&check.kind==='login')ok=body.includes(expectedHeading)&&body.includes('비밀번호');
                if(ok&&['release','health','manifest','private'].includes(check.kind)){
                  const data=JSON.parse(body);
                  if(check.kind==='release')ok=data.release===expectedRelease;
                  if(check.kind==='health')ok=data.status==='ok'&&data.database==='ok';
                  if(check.kind==='manifest')ok=data.name===expectedAppName;
                  if(check.kind==='private')ok=data.code==='UNAUTHORIZED';
                }
                row={path:check.path,status:response.status,passed:ok,attempt};
                if(ok||response.status===403||(location&&new URL(location,base).origin!==new URL(base).origin))break;
              }catch(error){row={path:check.path,passed:false,attempt,error:error instanceof Error?error.name:'UnknownError'};}
              if(attempt<8)await new Promise(resolve=>setTimeout(resolve,15000));
            }
            result.checks.push(row);console.log(JSON.stringify(row));if(!row?.passed)failed=true;
          }
          await writeFile('public-preview-result.json',JSON.stringify(result,null,2));
          if(failed)process.exitCode=1;
          NODE

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.PUBLIC_APP_URL != '' }}
        with:
          name: public-app-${{ github.sha }}
          path: public-preview-result.json
          retention-days: 7
          if-no-files-found: ignore
