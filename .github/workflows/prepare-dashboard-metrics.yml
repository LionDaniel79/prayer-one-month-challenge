name: Prepare dashboard metric sources
on:
  push:
    branches: [feature/admin-dashboard-metrics]
    paths: ['.maintenance/**', '.github/workflows/prepare-dashboard-metrics.yml']
permissions:
  contents: write
concurrency:
  group: prepare-dashboard-metrics
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'LionDaniel79/prayer-one-month-challenge' && github.ref == 'refs/heads/feature/admin-dashboard-metrics'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-dashboard-metrics
      - name: Apply checksum-verified source edits
        run: |
          python .maintenance/apply-dashboard.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: dashboard metrics and versioned pastoral confirmation'
          git push origin HEAD:refs/heads/feature/admin-dashboard-metrics
